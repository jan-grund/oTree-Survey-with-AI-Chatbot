{{ extends "global/Page.html" }}
{{ load static otree }}

{{ block app_styles }}

<style>

    /* ── base ─────────────────────────────────────────── */

    html, body {
        height: 100%;
        overflow: hidden;
    }

    .otree-body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        height: 100%;
        overflow: hidden;
    }

    /* hide the default oTree timer widget */
    .otree-timer {
        display: none;
    }

    /* ── full-viewport chat shell ─────────────────────── */

    .chatWrapper {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #f7f7f8;
        z-index: 10;
    }

    /* thin global progress bar sits flush at the very top of the chat shell */
    .chatWrapper .qs-progress-track {
        flex-shrink: 0;
        margin-bottom: 0;
        border-radius: 0;
    }

    /* ── top header bar ───────────────────────────────── */

    .chatHeader {
        flex-shrink: 0;
        background: #ffffff;
        border-bottom: 1px solid #e5e5e5;
        padding: 13px 16px;
        text-align: center;
        font-size: 15px;
        font-weight: 600;
        color: #0d0d0d;
    }

    /* ── scrollable message list ──────────────────────── */

    .chatMessages {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        /* centered reading column: 768px max, collapses gracefully on mobile */
        padding: 28px max(16px, calc(50% - 384px)) 12px;
        display: flex;
        flex-direction: column;
        scrollbar-gutter: stable;
    }

    .chatMessages::-webkit-scrollbar { width: 5px; }
    .chatMessages::-webkit-scrollbar-thumb { background: #c5c5d2; border-radius: 3px; }
    .chatMessages::-webkit-scrollbar-track { background: transparent; }

    /* ── message base (reset old defaults) ────────────── */

    .message {
        word-wrap: break-word;
        line-height: 1.65;
        margin-bottom: 4px;
        box-sizing: border-box;
        background: none;
        border-radius: 0;
        max-width: 100%;
        padding: 6px 0;
        cursor: default;
        transition: none;
        width: 100%;
        align-self: stretch;
    }

    /* hide JS-injected "You" / sender labels */
    .message strong {
        display: none;
    }

    /* ── system hint ──────────────────────────────────── */

    .sysMsg {
        align-self: center;
        width: auto;
        background: #ececf1;
        color: #6e6e80;
        font-size: 13px;
        padding: 5px 14px;
        border-radius: 8px;
        text-align: center;
        margin-bottom: 20px;
    }

    /* ── bot message — no bubble, avatar via ::before ─── */

    .botMsg {
        position: relative;
        padding-left: 46px;
        color: #0d0d0d;
        text-align: left;
    }

    .botMsg::before {
        content: 'AI';
        position: absolute;
        left: 0;
        top: 7px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #10a37f;
        color: #ffffff;
        font-size: 10px;
        font-weight: 700;
        line-height: 28px;
        text-align: center;
        flex-shrink: 0;
    }

    /* neutralise colour-class backgrounds on bot rows */
    .botMsg.blueText,
    .botMsg.redText,
    .botMsg.miscText {
        background: none;
        color: #0d0d0d;
    }

    /* ── user message — dark rounded bubble ───────────── */

    .selfMsg {
        align-self: flex-end;
        background: #2f2f2f;
        color: #ffffff;
        border-radius: 18px;
        padding: 10px 16px;
        max-width: 70%;
        width: auto;
        text-align: left;
    }

    /* ── typing indicator ─────────────────────────────── */
    /* Dots-only "response loading" signal. No avatar, name, or text —
       identical markup/CSS regardless of condition. */

    .typing {
        background: none;
        padding: 6px 0;
        width: 100%;
        max-width: 100%;
    }

    /* suppress the "AI" avatar badge inherited from .botMsg::before */
    .typing::before {
        display: none;
    }

    .typing-indicator {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #ececf1;
        border-radius: 18px;
        padding: 13px 16px;
        line-height: 0;
    }

    .typing-indicator span {
        width: 8px;
        height: 8px;
        background-color: #9b9ba8;
        border-radius: 50%;
        opacity: 0.35;
        animation: typingFade 1.3s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typingFade {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
        30%            { transform: translateY(-2px); opacity: 1; }
    }

    /* ── input area ───────────────────────────────────── */

    .inputArea {
        flex-shrink: 0;
        background: #f7f7f8;
        border-top: 1px solid #e5e5e5;
        /* same side padding as the message list for visual alignment */
        padding: 10px max(16px, calc(50% - 384px)) 24px;
    }

    /* static, non-scrolling — sits above the message list, not inside it */
    .instructionBox {
        flex-shrink: 0;
        background: #eef6fb;
        border-bottom: 1px solid #cfe3ee;
        padding: 8px max(16px, calc(50% - 384px));
    }

    .instructionBox p {
        margin: 0 0 4px 0;
        max-width: 768px;
        font-size: 12.5px;
        line-height: 1.5;
        color: #3a5f73;
    }

    .instructionBox p:last-child {
        margin-bottom: 0;
    }

    .timerHint {
        text-align: center;
        font-size: 12px;
        color: #8e8ea0;
        margin-bottom: 8px;
    }

    .chatContinueRow {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 12px;
    }

    .chatContinueRow .btn[disabled],
    .chatContinueRow .btn.is-disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    .chatNotice {
        display: none;
        margin-top: 8px;
        font-size: 13px;
        color: #c0392b;
        text-align: center;
    }

    .chatNotice.show {
        display: block;
    }

    .inputRow {
        display: flex;
        align-items: flex-end;
        background: #ffffff;
        border: 1px solid #d9d9e3;
        border-radius: 12px;
        padding: 6px 6px 6px 14px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    #chatinput {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        font-size: 16px;
        font-family: inherit;
        background: transparent;
        padding: 5px 8px 5px 0;
        color: #0d0d0d;
        resize: none;
        overflow-y: hidden;
        line-height: 1.5;
        min-height: 26px;
        max-height: 120px;
    }

    #chatinput::placeholder {
        color: #8e8ea0;
    }

    .sendBtn {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: #2f2f2f;
        border: none;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s;
    }

    .sendBtn:hover { background: #111111; }

    .sendBtn svg {
        width: 17px;
        height: 17px;
    }

</style>

{{ endblock }}
