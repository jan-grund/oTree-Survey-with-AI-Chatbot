{{ block title }}&nbsp;{{ endblock }}
{{ block content }}
<style>
.qs-page{max-width:680px}
.qs-content-intro{font-size:1.05rem;font-weight:600;color:#1a1a1a;line-height:1.5;margin-bottom:1rem}
.qs-fillin-instruction{font-size:.85rem;font-weight:400;color:#555;margin-bottom:1.25rem}
.q-block{margin-bottom:2rem}
.q-label{font-size:.97rem;font-weight:500;margin-bottom:.65rem;line-height:1.5;color:#1a1a1a}
.scale-container{width:100%}
.scale-row{display:flex;flex-direction:column}
.scale-row input[type=radio]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}
.scale-row label{width:100%;min-height:44px;display:flex;align-items:center;justify-content:flex-start;border:1.5px solid #ccc;border-top-width:0;cursor:pointer;font-size:.92rem;font-weight:500;color:#555;background:#fff;transition:background .15s,color .15s,border-color .15s;user-select:none;text-align:left;padding:.55rem .8rem;overflow-wrap:break-word;hyphens:auto;line-height:1.3}
@media (max-width:699px){
  .scale-row label:first-of-type{border-top-width:1.5px;border-radius:8px 8px 0 0}
  .scale-row label:last-of-type{border-radius:0 0 8px 8px}
}
.scale-row label:hover{background:#f5f5f5;color:#222}
.scale-row input[type=radio]:checked+label{background:#2d3748;color:#fff;border-color:#2d3748}
.scale-row input[type=radio]:focus-visible+label{outline:2px solid #2d3748;outline-offset:2px}
.q-error-msg{display:none;color:#c0392b;font-size:.8rem;margin-top:4px}
.q-block.has-error .scale-row label{border-color:#e05555}
.q-block.has-error .q-error-msg{display:block}

@media (min-width:700px){
  .scale-row{flex-direction:row;flex-wrap:nowrap;gap:.4rem}
  .scale-row label{flex:1 1 0;min-width:0;border-radius:8px;border-top-width:1.5px;justify-content:center;text-align:center;padding:.5rem .4rem}
}
</style>

<div class="qs-page">
  {{ include '_progress.html' with percent=progress.percent }}

  {{ for q in questions }}
  <div class="q-block" data-field="{{ q.name }}">
    <p class="q-label">{{ q.label }}</p>
    <div class="scale-container">
      <div class="scale-row">
        {{ for c in q.choices }}
        <input type="radio" name="{{ q.name }}" id="{{ q.name }}_{{ c.value }}" value="{{ c.value }}">
        <label for="{{ q.name }}_{{ c.value }}">{{ c.text }}</label>
        {{ endfor }}
      </div>
    </div>
    <div class="q-error-msg">Please select an answer.</div>
  </div>
  {{ endfor }}

  <button type="button" id="next-btn" class="btn btn-primary btn-large">Next</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var form = document.querySelector('form');
  if (!form) return;
  form.noValidate = true;
  var nextBtn = document.getElementById('next-btn');
  if (nextBtn) {
    nextBtn.addEventListener('click', function () {
      var blocks = document.querySelectorAll('.q-block[data-field]');
      var firstErr = null;
      blocks.forEach(function (b) {
        var name = b.dataset.field;
        if (!document.querySelector('input[name="' + name + '"]:checked')) {
          b.classList.add('has-error');
          if (!firstErr) firstErr = b;
        } else {
          b.classList.remove('has-error');
        }
      });
      if (firstErr) { firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      form.requestSubmit ? form.requestSubmit() : form.submit();
    });
  }
  document.querySelectorAll('.q-block input[type=radio]').forEach(function (r) {
    r.addEventListener('change', function () { this.closest('.q-block').classList.remove('has-error'); });
  });
});
</script>
{{ endblock }}
